<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f3f7fc" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DevHub" />
    <meta name="msapplication-navbutton-color" content="#f3f7fc" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="La página solicitada no existe en DevHub." />
    <meta name="color-scheme" content="dark light" />
    <meta name="darkreader-lock" />
    <title>DevHub — Página no encontrada</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/icon-192.png" />
    <script src="js/theme-bootstrap.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/app-shell.css" />
    <script type="module">
        import { initTheme } from './js/theme-service.js';
        initTheme();
    </script>
</head>
<body>
    <main class="error-page">
        <section class="error-card app-surface-card" aria-labelledby="error-title">
            <img class="error-card__logo" src="assets/logo.svg" alt="" aria-hidden="true" />
            <p class="error-card__code">Error 404</p>
            <h1 class="error-card__title" id="error-title">Página no encontrada</h1>
            <p class="error-card__text">La ruta que buscas no existe o cambió de ubicación. Puedes regresar a tu espacio de DevHub.</p>
            <a id="back-link" href="index.html" class="app-primary-btn">Volver al inicio</a>
        </section>
    </main>
    <script>
        /*
         * Compatibilidad con GitHub Pages:
         * Si la URL contiene un hash de Supabase (access_token, recovery),
         * redirigir a index.html preservando el hash para que el SDK lo procese.
         */
        (function () {
            var hash = window.location.hash;
            if (hash && (hash.indexOf('access_token') !== -1 || hash.indexOf('type=recovery') !== -1)) {
                var basePath = window.location.pathname;
                if (basePath.indexOf('404.html') !== -1) {
                    basePath = basePath.replace('404.html', '');
                }
                window.location.replace(basePath + 'index.html' + hash);
            }
        })();
    </script>
</body>
</html>
